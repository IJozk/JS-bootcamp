<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listar Estudiantes</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>
<body>

    <!-- 🧪 Actividad: Manejo de Arreglos (Preparación Evaluación del AE actual)
            1. Crear un arreglo con 4 estudiantes
            2. Mostrar la lista utilizando un ciclo for
            3. Contar la cantidad total de estudiantes
            4. Agregar 2 estudiantes nuevos al arreglo
            5. Buscar un estudiante específico dentro del arreglo
            6. Eliminar un estudiante del arreglo
            7. Mostrar la lista final de estudiantes -->

    <div class="container">
        <h2 class="my-4">Lista de estudiantes</h2>
        <h3 class="mb-4" id="cantidad-est"></h3>
        <div class="row"> <input type="text" id="filtroNombre"> <button type="button" onclick="filtroNombre()">Buscar</button></div>
        <div class="row">
            <div class="col-md-1"></div>
            <div class="col-md-10">
                <div
                    class="table-responsive"
                >
                    <table
                        class="table table-primary"
                        id="tabla-estudiantes"
                    >
                        <thead>
                            <tr>
                                <th scope="col">Nombre completo</th>
                                <th scope="col">Edad</th>
                                <th scope="col">Promedio</th>
                                <th scope="col">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="body-table">
                        </tbody>
                            <tr>
                                <td scope="col"><input type="text" class="mb-2" id="nombreIn" placeholder="Nombre"><input type="text" id="apellidoIn" placeholder="Apellido"></td>
                                <td scope="col"><input type="number" id="edadIn" placeholder="Ingrese edad"></td>
                                <td scope="col"><input type="number" id="promedioIn" placeholder="Ingrese promedio"></td>
                                <td scope="col"><button class='btn btn-success' onclick="addRow()">Añadir</button></td>
                            </tr>
                    </table>
                </div>
                
            </div>
        </div>
    </div>

    
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
    <script src="./assets/js/ejercicio_4.js"></script>
</body>
</html>
