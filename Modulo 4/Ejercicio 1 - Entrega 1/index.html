<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
    <header>
        <h1 class="p-5">Biblioteca</h1>
    </header>
    <main>
        <div class="container border rounded-3 p-4 my-5 shadow-lg">
            <h2 class="m-3 mb-5">Inventario de Libros</h2>
            <div id="book-list" class="row g-5">
                <div class="col-8">
                    <div
                        class="table-responsive px-5"
                    >
                        <table
                            class="table table-light table-striped table-hover align-middle"
                        >
                            <thead class="table-dark">
                                <tr>
                                    <th scope="col">ID</th>
                                    <th scope="col">Título</th>
                                    <th scope="col">Autor</th>
                                    <th scope="col">Estado</th>
                                </tr>
                            </thead>
                            <tbody id="book-table-body">
                                <!-- Los libros se agregarán aquí dinámicamente -->
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="col">
                    <a
                        name=""
                        id=""
                        class="btn btn-primary"
                        href="#"
                        onclick="nuevoLibro()"
                        role="button"
                        >Añadir Libro</a
                    >
                </div>
            </div>
        </div>

    </main>

    <footer>
        <p></p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>    
    <script src="./assets/js/script.js"></script>
</body>
</html>
