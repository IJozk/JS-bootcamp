<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería Interactiva</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./assets/css/styles.css">
</head>
<body>
    <h1>Mi Galería de Imágenes</h1>
    <main class="galeria-container">
        <div id="imagen-principal-container">
            <img id="imagen-principal" src="https://placehold.co/600x400?text=Selecciona+una+imagen." alt="Imagen principal de la galería">
            
        </div>

        <div class="thumbnails">
            <img src="https://placehold.co/600x400/EEE/31343C?font=roboto&text=Roboto" alt="Descripción de la imagen 1" class="thumbnail">
            <img src="https://placehold.co/600x400/EEE/31343C?font=pt-sans&text=PT%20Sans" alt="Descripción de la imagen 2" class="thumbnail">
            <img src="https://placehold.co/600x400/EEE/31343C?font=playfair-display&text=Playfair%20Display" alt="Descripción de la imagen 3" class="thumbnail">
            <img src="https://placehold.co/600x400/EEE/31343C?font=open-sans&text=Open%20Sans" alt="Descripción de la imagen 4" class="thumbnail">
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
    <script src="./assets/js/app.js"></script>
</body>
</html>
